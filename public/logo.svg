<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyber-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#00C97D" />
    </linearGradient>
    <linearGradient id="space-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="50" cy="50" r="45" fill="url(#glow)" />

  <!-- Outer Cyber Hexagon -->
  <polygon points="50,12 83,31 83,69 50,88 17,69 17,31" 
           fill="none" 
           stroke="url(#cyber-green)" 
           stroke-width="2.5" 
           stroke-linejoin="round" />

  <!-- Inner Tech Hexagon -->
  <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" 
           fill="none" 
           stroke="url(#space-gold)" 
           stroke-width="1.5" 
           stroke-linejoin="round" 
           stroke-dasharray="16, 4, 8, 4" />

  <!-- Orbital Trajectory Loop -->
  <path d="M 32,54 C 32,38 68,38 68,54 C 68,70 32,70 32,54 Z" 
        fill="none" 
        stroke="url(#space-gold)" 
        stroke-width="1.5" 
        transform="rotate(-25 50 54)" />

  <!-- Orbiting Satellite Dot -->
  <circle cx="64" cy="40" r="3" fill="#FFF7E6" />
  <circle cx="64" cy="40" r="5" fill="none" stroke="#FBBF24" stroke-width="0.5" />

  <!-- Central Core Shield Grid -->
  <path d="M 45,46 L 50,42 L 55,46 L 55,54 L 50,58 L 45,54 Z" 
        fill="url(#cyber-green)" 
        opacity="0.8" />
</svg>
